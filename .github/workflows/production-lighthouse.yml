name: Production launch audit (Lighthouse)

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "53 5 * * 1"

permissions:
  contents: read

concurrency:
  group: production-lighthouse-audit
  cancel-in-progress: true

jobs:
  lighthouse:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Public-page performance, accessibility and SEO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect Lighthouse reports from public pages
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes @lhci/cli@0.15.1 collect \
              --url=https://nexora-core.nxora.workers.dev/en \
              --url=https://nexora-core.nxora.workers.dev/en/templates \
              --url=https://nexora-core.nxora.workers.dev/en/pricing \
              --url=https://nexora-core.nxora.workers.dev/en/templates/aether \
              --url=https://nexora-core.nxora.workers.dev/en/license \
              --url=https://nexora-core.nxora.workers.dev/en/refunds \
              --numberOfRuns=1 \
              --settings.chromeFlags="--no-sandbox --headless=new"; then
              exit 0
            fi
            echo "Lighthouse collection failed (attempt $attempt/3); retrying after transient registry/network errors."
            sleep $((attempt * 10))
          done
          echo "Lighthouse collection failed after three attempts." >&2
          exit 1
      - name: Save HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-lighthouse-reports
          path: .lighthouseci
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
