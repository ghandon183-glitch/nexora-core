name: IndexNow submission

on:
  push:
    paths:
      - ".github/indexnow-submit.txt"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit current important URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          key="7fec80c6cbd74405bad9e8ca5bcec3dc"
          host="nexora-core.nxora.workers.dev"
          keyLocation="https://$host/$key.txt"
          urls="[\"https://$host/en\",\"https://$host/en/templates\",\"https://$host/en/templates/vesper\",\"https://$host/en/docs/vesper\",\"https://$host/sitemap.xml\"]"
          payload=$(printf '{"host":"%s","key":"%s","keyLocation":"%s","urlList":%s}' "$host" "$key" "$keyLocation" "$urls")
          code=$(curl -sS -o /tmp/indexnow-response -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$payload")
          echo "IndexNow HTTP $code"
          cat /tmp/indexnow-response || true
          test "$code" = "200" || test "$code" = "202"
          echo "IndexNow submission: PASS"
