name: IndexNow submission

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: nexora-indexnow-submission
  cancel-in-progress: true

jobs:
  submit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover canonical URLs from the live sitemap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          host = "nexora-core.nxora.workers.dev"
          base = f"https://{host}"
          queue = [f"{base}/sitemap.xml"]
          seen_sitemaps = set()
          urls = set()

          while queue:
              sitemap_url = queue.pop()
              if sitemap_url in seen_sitemaps:
                  continue
              parsed = urlparse(sitemap_url)
              if parsed.scheme != "https" or parsed.netloc != host:
                  raise SystemExit(f"Refusing off-host sitemap URL: {sitemap_url}")
              seen_sitemaps.add(sitemap_url)
              request = urllib.request.Request(
                  sitemap_url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; NexoraIndexingAudit/1.0; +https://nexora-core.nxora.workers.dev/)",
                      "Accept": "application/xml,text/xml,*/*",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status != 200:
                          raise SystemExit(f"Sitemap returned HTTP {response.status}: {sitemap_url}")
                      root = ET.fromstring(response.read())
              except Exception as exc:
                  raise SystemExit(f"Could not read production sitemap {sitemap_url}: {exc}") from exc

              for node in root.iter():
                  if node.tag.rsplit("}", 1)[-1] != "loc" or not node.text:
                      continue
                  value = node.text.strip()
                  parsed_value = urlparse(value)
                  if parsed_value.scheme != "https" or parsed_value.netloc != host:
                      continue
                  if parsed_value.path.endswith(".xml"):
                      queue.append(value)
                  else:
                      urls.add(value)

          if not urls:
              raise SystemExit("No canonical URLs found in the production sitemap")
          if len(urls) > 10000:
              raise SystemExit(f"Refusing to submit more than 10,000 URLs: {len(urls)}")

          key = "7fec80c6cbd74405bad9e8ca5bcec3dc"
          payload = {
              "host": host,
              "key": key,
              "keyLocation": f"{base}/{key}.txt",
              "urlList": sorted(urls),
          }
          with open("indexnow-payload.json", "w", encoding="utf-8") as output:
              json.dump(payload, output)
          print(f"INDEXNOW_URL_COUNT={len(urls)}")
          print("INDEXNOW_HOST=verified production host only")
          PY
      - name: Verify IndexNow key endpoint
        run: |
          set -euo pipefail
          host="https://nexora-core.nxora.workers.dev"
          key="7fec80c6cbd74405bad9e8ca5bcec3dc"
          response="$(curl --fail --silent --show-error "$host/$key.txt")"
          test "$response" = "$key"
          echo "IndexNow key verification: PASS"
      - name: Submit all sitemap URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          code="000"
          for attempt in 1 2 3 4 5; do
            code="$(curl --connect-timeout 10 --max-time 30 --silent --show-error \
              -o indexnow-response.txt -w "%{http_code}" \
              -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary @indexnow-payload.json || true)"
            echo "IndexNow attempt=$attempt HTTP=$code"
            if [[ "$code" == "200" || "$code" == "202" ]]; then
              break
            fi
            if [[ "$code" =~ ^5[0-9][0-9]$ || "$code" == "429" || "$code" == "000" ]]; then
              if [[ "$attempt" -lt 5 ]]; then
                sleep "$((attempt * 10))"
                continue
              fi
            fi
            break
          done
          cat indexnow-response.txt || true
          test "$code" = "200" || test "$code" = "202"
          echo "IndexNow submission: PASS"
      - name: Save submission summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-indexnow-submission
          path: |
            indexnow-payload.json
            indexnow-response.txt
          if-no-files-found: warn
          retention-days: 14
