name: One-time dependency lockfile refresh

on:
  push:
    branches:
      - codex/security-dependency-remediation-2026-10-23
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/one-time-dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile without running package lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          # Apply non-breaking fixes only; deliberately do not use --force.
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          fix_status=$?
          set -e
          echo "npm audit fix exit status: $fix_status"
          npm audit --audit-level=high || audit_status=$?
          echo "Post-fix audit exit status: ${audit_status:-0}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/one-time-dependency-lock-refresh.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were produced."
            exit 1
          fi
          git commit -m "chore(deps): regenerate lockfile and remove one-time helper [skip ci]"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
