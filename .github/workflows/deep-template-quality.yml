name: Deep code quality audit - all template packages
# Re-run this blocking gate after shipped archive rebuilds and demo accessibility fixes.

on:
  workflow_dispatch:
  push:
    paths:
      - "public/downloads/**"
      - "scripts/harden-template-archives.py"
      - ".github/workflows/harden-template-archives.yml"
      - ".github/workflows/audit-template-packages.yml"
      - "public/demo/**"
      - ".github/workflows/deep-template-quality.yml"
      - "lib/data/templates.ts"
      - "lib/data/template-guides.ts"
      - "components/product/purchase-card.tsx"
      - "components/product/product-demo-video.tsx"
  pull_request:
    paths:
      - "public/downloads/**"
      - "scripts/harden-template-archives.py"
      - ".github/workflows/harden-template-archives.yml"
      - ".github/workflows/audit-template-packages.yml"
      - "public/demo/**"
      - ".github/workflows/deep-template-quality.yml"
      - "lib/data/templates.ts"
      - "lib/data/template-guides.ts"
      - "components/product/purchase-card.tsx"
      - "components/product/product-demo-video.tsx"

concurrency:
  group: nexora-deep-template-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deep-audit:
    name: Audit all shipped template packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install audit tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.11.0
          npx playwright install --with-deps chromium
      - name: Extract packages
        run: |
          set -euo pipefail
          rm -rf .deep-audit
          mkdir -p .deep-audit/packages
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile
          out = Path('.deep-audit/packages')
          for z in sorted(Path('public/downloads').glob('*.zip')):
              if z.name.startswith('Nexora-All-Templates'): continue
              d = out / re.sub(r'\.zip$', '', z.name, flags=re.I)
              d.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(z) as archive:
                  # Reject Zip Slip paths and symlinks before extracting untrusted archive members.
                  for member in archive.infolist():
                      member_path = Path(member.filename)
                      if member_path.is_absolute() or '..' in member_path.parts:
                          raise SystemExit(f'Unsafe archive path in {z.name}: {member.filename!r}')
                      if (member.external_attr >> 16) & 0o170000 == 0o120000:
                          raise SystemExit(f'Symlink entry is not allowed in {z.name}: {member.filename!r}')
                  archive.extractall(d)
          print('packages:', len(list(out.iterdir())))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, zipfile

          root = Path("public/downloads")
          out = Path(".deep-audit")
          out.mkdir(parents=True, exist_ok=True)
          lines = [
              "# Shipped ZIP archive contents audit",
              "",
              "This report inspects the exact ZIP files checked out by this workflow run. A successful build does not prove third-party asset rights; that still needs human review.",
              "",
          ]
          for archive in sorted(root.glob("*.zip")):
              if archive.name.startswith("Nexora-All-Templates"):
                  continue
              with zipfile.ZipFile(archive) as zf:
                  names = [n for n in zf.namelist() if not n.endswith("/")]
                  readmes = [n for n in names if re.search(r"(^|/)readme(?:[^/]*)\.(?:md|txt)$", n, re.I)]
                  licenses = [n for n in names if re.search(r"(^|/)(?:license|licence)(?:[^/]*)\.(?:md|txt|html)$", n, re.I)]
                  asset_manifests = [n for n in names if Path(n).name.lower() in ("asset-licenses.md", "third-party-licenses.md")]
                  package_paths = [n for n in names if Path(n).name.lower() == "package.json" and "node_modules/" not in n.lower()]
                  lockfiles = [n for n in names if Path(n).name.lower() in ("package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bun.lockb", "bun.lock")]
                  env_examples = [n for n in names if Path(n).name.lower() in (".env.example", ".env.sample", ".env.template")]
                  docs = [n for n in names if re.search(r"(^|/)(docs?|documentation)(/|$)", n, re.I)]
                  build_artifacts = [n for n in names if re.search(r"(^|/)(node_modules|\.next|dist|build|out|\.git)(/|$)", n, re.I)]
                  packages = []
                  for p in package_paths[:10]:
                      try:
                          pkg = json.loads(zf.read(p).decode("utf-8"))
                          packages.append((p, pkg))
                      except Exception as e:
                          packages.append((p, {"_parse_error": str(e)}))
                  lines += [
                      f"## {archive.name}",
                      f"- SHA-256: {hashlib.sha256(archive.read_bytes()).hexdigest()}",
                      f"- Size: {archive.stat().st_size:,} bytes",
                      f"- Files: {len(names)}",
                      f"- README: {'YES — ' + ', '.join(readmes[:5]) if readmes else 'NO'}",
                      f"- License document: {'YES — ' + ', '.join(licenses[:5]) if licenses else 'NO'}",
                      f"- Asset/third-party license manifest: {'YES — ' + ', '.join(asset_manifests[:5]) if asset_manifests else 'NO'}",
                      f"- package.json: {'YES — ' + ', '.join(package_paths[:5]) if package_paths else 'NO (possibly a static package)'}",
                      f"- Lockfile: {'YES — ' + ', '.join(lockfiles[:5]) if lockfiles else 'NO'}",
                      f"- Environment example: {'YES — ' + ', '.join(env_examples[:5]) if env_examples else 'NO'}",
                      f"- Documentation paths: {len(docs)}",
                      f"- Bundled build/dependency artifacts: {len(build_artifacts)}",
                  ]
                  for p, pkg in packages:
                      lines += [
                          f"- Manifest {p}: name={pkg.get('name', 'UNKNOWN')}, version={pkg.get('version', 'UNSPECIFIED')}, next={pkg.get('dependencies', {}).get('next', pkg.get('devDependencies', {}).get('next', 'NOT DECLARED'))}, tailwind={pkg.get('dependencies', {}).get('tailwindcss', pkg.get('devDependencies', {}).get('tailwindcss', 'NOT DECLARED'))}",
                          f"- Scripts: {json.dumps(pkg.get('scripts', {}), ensure_ascii=False)}",
                      ]
                  lines.append("")
          (out / "ARCHIVE_CONTENTS.md").write_text("\n".join(lines), encoding="utf-8")
          PY
      - name: Run package quality checks
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          : > .deep-audit/REPORT.md
          for dir in .deep-audit/packages/*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            echo "## $name" >> .deep-audit/REPORT.md
            echo "=== PACKAGE: $name ==="
            if [ ! -f "$dir/package.json" ]; then
              echo "$name: static package (no package.json) — N/A"
              echo '- package.json: N/A (static template)' >> .deep-audit/REPORT.md
              continue
            fi
            if (cd "$dir" && npm install --legacy-peer-deps --no-fund --no-audit); then
              echo "$name: npm install PASS"
            else
              echo "$name: npm install FAIL"
              echo '- npm install: FAIL' >> .deep-audit/REPORT.md
              failures=$((failures+1)); continue
            fi
            if node -e "const p=require('./$dir/package.json'); process.exit(p.scripts&&p.scripts.build?0:1)"; then
              if (cd "$dir" && npm run build); then
                echo "$name: build PASS"; echo '- build: PASS' >> .deep-audit/REPORT.md
              else
                echo "$name: build FAIL"; echo '- build: FAIL' >> .deep-audit/REPORT.md; failures=$((failures+1))
              fi
            else echo '- build: NOT RUN' >> .deep-audit/REPORT.md; fi
            # Next.js build already performs TypeScript validation. Do not run tsc over its generated .next output.
            if node -e "const p=require('./$dir/package.json'); process.exit(((p.dependencies?.next || p.devDependencies?.next) && p.scripts?.build) ? 0 : 1)"; then
              echo '- typecheck: covered by Next.js build' >> .deep-audit/REPORT.md
            elif find "$dir" -path "$dir/node_modules" -prune -o -path "$dir/.next" -prune -o -type f \( -name '*.ts' -o -name '*.tsx' \) -print | grep -q .; then
              if (cd "$dir" && npx tsc --noEmit); then
                echo "$name: typecheck PASS"; echo '- typecheck: PASS' >> .deep-audit/REPORT.md
              else
                echo "$name: typecheck FAIL"; echo '- typecheck: FAIL' >> .deep-audit/REPORT.md; failures=$((failures+1))
              fi
            else echo '- typecheck: NOT RUN' >> .deep-audit/REPORT.md; fi
            if node -e "const p=require('./$dir/package.json'); process.exit(p.scripts&&p.scripts.lint?0:1)"; then
              rm -rf "$dir/.next"
              if (cd "$dir" && npm run lint); then
                echo '- lint: PASS' >> .deep-audit/REPORT.md
              else
                echo '- lint: ADVISORY FAIL (non-blocking; see job log)' >> .deep-audit/REPORT.md
              fi
            else echo '- lint: NOT RUN' >> .deep-audit/REPORT.md; fi
            if (cd "$dir" && npm audit --audit-level=high --omit=dev); then
              echo "$name: npm audit PASS"; echo '- npm audit high+: PASS' >> .deep-audit/REPORT.md
            else
              echo "$name: npm audit FAIL"; echo '- npm audit high+: FAIL' >> .deep-audit/REPORT.md; failures=$((failures+1))
            fi
            echo >> .deep-audit/REPORT.md
          done
          echo "failures=$failures" >> .deep-audit/REPORT.md
          echo "BLOCKING_PACKAGE_FAILURES=$failures"
          if [ "$failures" -ne 0 ]; then
            echo "Package quality gate has blocking failures; runtime audit will still run." >&2
          fi
          printf '%s\n' "$failures" > .deep-audit/package-failures.txt
      - name: Runtime and accessibility audit of published demos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/nexora-public.log 2>&1 &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          class NextStaticHandler(SimpleHTTPRequestHandler):
              def guess_type(self, path):
                  if path.lower().endswith(".txt"):
                      return "text/x-component"
                  return super().guess_type(path)
          ThreadingHTTPServer(("127.0.0.1", 4174), lambda *args, **kwargs: NextStaticHandler(*args, directory="public", **kwargs)).serve_forever()
          PY
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const axe = require('axe-core');
          const fs = require('fs');
          const base = 'http://127.0.0.1:4174';
          const demos = ['vesper','admin-dashboard','aether','aurelia-store','creative-agency','kiln-estates','modern-saas','nexi-ai','premium-blog','premium-portfolio','premium-restaurant','solace-studio'];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            let failures = 0;
            for (const demo of demos) {
              const file = `public/demo/${demo}/index.html`;
              if (!fs.existsSync(file)) { console.log(`${demo}: NOT FOUND`); continue; }
              const page = await browser.newPage({viewport:{width:1440,height:900}});
              const errors=[]; const pageErrors=[]; const failed=[];
              page.on('console',m=>{if(m.type()==='error') errors.push({text:m.text(),location:m.location()})});
              page.on('pageerror',e=>pageErrors.push({message:e.message,stack:e.stack || null}));
              page.on('requestfailed',r=>failed.push({url:r.url(),failure:r.failure()?.errorText || 'unknown'}));
              try {
                await page.goto(`http://127.0.0.1:4174/demo/${demo}/`,{waitUntil:'networkidle',timeout:30000});
                await page.addScriptTag({content:axe.source});
                const a11y = await page.evaluate(async()=>await axe.run(document));
                const importantViolations = a11y.violations.filter(v => v.impact === 'critical' || v.impact === 'serious');
                const sameOriginFailed = failed.filter(request => request.url.startsWith(base));
                console.log('CONSOLE_ERRORS ' + demo + ' ' + JSON.stringify(errors));
                console.log('PAGE_ERRORS ' + demo + ' ' + JSON.stringify(pageErrors));
                console.log('FAILED_REQUESTS ' + demo + ' ' + JSON.stringify(sameOriginFailed));
                console.log('A11Y_DETAILS ' + demo + ' ' + JSON.stringify(a11y.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.length,details:v.nodes.slice(0,8).map(n=>({target:n.target,html:n.html,failureSummary:n.failureSummary}))}))));
                await page.setViewportSize({width:390,height:844});
                const overflow = await page.evaluate(()=>document.documentElement.scrollWidth > innerWidth + 2);
                const productionBlocking = demo === 'vesper';
                const ok = errors.length===0 && pageErrors.length===0 && !overflow && (!productionBlocking || (sameOriginFailed.length===0 && importantViolations.length===0));
                console.log(demo + ': ' + (ok ? 'PASS' : 'FAIL') + ' blocking=' + (productionBlocking ? 'production' : 'advisory-template') + ' console=' + errors.length + ' page=' + pageErrors.length + ' sameOriginRequests=' + sameOriginFailed.length + ' a11yImportant=' + importantViolations.length + ' a11yTotal=' + a11y.violations.length + ' overflow=' + overflow);
                if(!ok) failures++;
              } catch(e) { console.log(`${demo}: FAIL ${e}`); failures++; }
              await page.close();
            }
            await browser.close();
            fs.appendFileSync('.deep-audit/REPORT.md', `Runtime failures: ${failures}\n`);
            fs.writeFileSync('.deep-audit/runtime-failures.txt', String(failures));
            process.exitCode = 0;
          })();
          NODE
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexora-deep-quality-audit-${{ github.run_id }}
          path: |
            .deep-audit/REPORT.md
            .deep-audit/ARCHIVE_CONTENTS.md
            .deep-audit/package-failures.txt
            .deep-audit/runtime-failures.txt
          retention-days: 30

          include-hidden-files: true
      - name: Enforce final deep quality gate
        if: always()
        shell: bash
        run: |
          set -u
          package_failures=0
          runtime_failures=0
          if [ -f .deep-audit/package-failures.txt ]; then package_failures=$(cat .deep-audit/package-failures.txt); fi
          if [ -f .deep-audit/runtime-failures.txt ]; then runtime_failures=$(cat .deep-audit/runtime-failures.txt); fi
          echo "BLOCKING_PACKAGE_FAILURES=$package_failures"
          echo "RUNTIME_FAILURES=$runtime_failures"
          if [ "$package_failures" -ne 0 ] || [ "$runtime_failures" -ne 0 ]; then
            echo "DEEP QUALITY GATE: FAIL"
            exit 1
          fi
          echo "DEEP QUALITY GATE: PASS"
