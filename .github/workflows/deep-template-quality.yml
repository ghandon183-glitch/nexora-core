name: Template release gate — all 12 products

# Single blocking quality gate for the 12 commercially shipped template
# packages. It verifies the exact customer ZIPs (integrity, required
# documentation, clean install, production build, lint, dependency audit) and
# the published demos (runtime, hydration, network, links, accessibility,
# responsive overflow, reduced motion) using the same scripts developers run
# locally. Every product in scripts/templates.manifest.json is mandatory:
# a missing archive or demo fails the gate instead of being skipped.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/downloads/**"
      - "public/demo/**"
      - "scripts/templates.manifest.json"
      - "scripts/verify-template-packages.py"
      - "scripts/template-quality-gate.mjs"
      - "scripts/harden-template-archives.py"
      - "lib/data/templates.ts"
      - "lib/data/downloads.ts"
      - ".github/workflows/deep-template-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/downloads/**"
      - "public/demo/**"
      - "scripts/templates.manifest.json"
      - "scripts/verify-template-packages.py"
      - "scripts/template-quality-gate.mjs"
      - "scripts/harden-template-archives.py"
      - "lib/data/templates.ts"
      - "lib/data/downloads.ts"
      - ".github/workflows/deep-template-quality.yml"

concurrency:
  group: nexora-template-release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archives:
    name: Customer ZIPs — install, build, lint, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify every shipped archive
        run: python3 scripts/verify-template-packages.py

      - name: Upload archive report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexora-package-report-${{ github.run_id }}
          path: |
            .deep-audit/package-report.json
            .deep-audit/package-report.md
          retention-days: 30
          include-hidden-files: true

  demos:
    name: Demos — runtime, hydration, links, accessibility, responsive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.11.0
          npx playwright install --with-deps chromium

      - name: Run the unified demo gate
        env:
          PLAYWRIGHT_DIR: ${{ github.workspace }}
        run: node scripts/template-quality-gate.mjs --out .deep-audit

      - name: Upload demo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexora-demo-gate-${{ github.run_id }}
          path: |
            .deep-audit/demo-report.json
            .deep-audit/demo-report.md
            .deep-audit/*-desktop.png
            .deep-audit/*-mobile.png
          retention-days: 30
          include-hidden-files: true

  release-gate:
    name: Release gate verdict
    needs: [archives, demos]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when any required product check failed
        run: |
          echo "archives=${{ needs.archives.result }}"
          echo "demos=${{ needs.demos.result }}"
          if [ "${{ needs.archives.result }}" != "success" ] || [ "${{ needs.demos.result }}" != "success" ]; then
            echo "TEMPLATE RELEASE GATE: FAIL"
            exit 1
          fi
          echo "TEMPLATE RELEASE GATE: PASS"
