name: Playwright launch smoke tests

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

concurrency:
  group: playwright-launch-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright and Chromium on the GitHub runner
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Build application
        env:
          SITE_URL: http://127.0.0.1:3000
          GA_MEASUREMENT_ID: G-TEST000000
        run: npm run build
      - name: Start production build
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/nexora-next.log 2>&1 &
          echo $! > /tmp/nexora-next.pid
      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/en >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nexora-next.log
          exit 1
      - name: Run browser smoke tests
        run: npx playwright test
      - name: Collect local Lighthouse homepage report on pull requests
        if: github.event_name == 'pull_request'
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes @lhci/cli@0.15.1 collect \
              --url=http://127.0.0.1:3000/en \
              --numberOfRuns=1 \
              --settings.chromeFlags="--no-sandbox --headless=new"; then
              exit 0
            fi
            echo "Local Lighthouse failed (attempt $attempt/3); retrying."
            sleep $((attempt * 10))
          done
          echo "Local Lighthouse failed after three attempts." >&2
          exit 1
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-playwright-report
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  production-smoke:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    name: Read-only production browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://nexora-core.nxora.workers.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright and Chromium on the GitHub runner
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Check live production routes, checkout guard and protected download denial
        run: npx playwright test
      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-production-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
