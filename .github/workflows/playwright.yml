name: Playwright launch smoke tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

concurrency:
  group: playwright-launch-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright and Chromium on the GitHub runner
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start production build
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/nexora-next.log 2>&1 &
          echo $! > /tmp/nexora-next.pid
      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/en >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nexora-next.log
          exit 1
      - name: Run browser smoke tests
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
