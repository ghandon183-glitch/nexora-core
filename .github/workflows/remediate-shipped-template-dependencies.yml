name: Remediate shipped template runtime dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - test/payment-outbox-regression
    paths:
      - ".github/workflows/remediate-shipped-template-dependencies.yml"

permissions:
  contents: write

concurrency:
  group: nexora-shipped-template-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: test/payment-outbox-regression
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Patch only known vulnerable runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, shutil

          targets = ("aether", "kiln-estates", "nexi-ai")
          root = Path(".remediation")
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir()
          for name in targets:
              archive = Path("public/downloads") / f"{name}.zip"
              if not archive.is_file():
                  raise SystemExit(f"Missing shipped archive: {archive}")
              dest = root / name
              dest.mkdir(parents=True)
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(dest)
              manifests = [p for p in dest.rglob("package.json") if "node_modules" not in p.parts]
              if len(manifests) != 1:
                  raise SystemExit(f"{name}: expected exactly one project package.json, found {len(manifests)}")
              manifest = manifests[0]
              project = manifest.parent
              pkg = json.loads(manifest.read_text(encoding="utf-8"))
              for section in ("dependencies", "devDependencies", "optionalDependencies"):
                  deps = pkg.get(section, {})
                  if "next" in deps:
                      deps["next"] = "16.4.2"
              # AETHER imports next-intl middleware and routing directly. Keep that
              # runtime dependency explicit in the shipped package rather than relying
              # on the monorepo's root node_modules to make its build pass.
              if name == "aether":
                  pkg.setdefault("dependencies", {})["next-intl"] = "^4.13.2"
              # shadcn is a build-time CLI, not a runtime dependency. Moving it out
              # of dependencies removes its vulnerable CLI dependency tree from the
              # shipped production install without forcing a breaking CLI major.
              deps = pkg.get("dependencies", {})
              if "shadcn" in deps:
                  version = deps.pop("shadcn")
                  pkg.setdefault("devDependencies", {})["shadcn"] = version
              manifest.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              # Do not retain stale lockfiles that pin vulnerable Next.js versions.
              for lock in ("package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock"):
                  (project / lock).unlink(missing_ok=True)
              print(f"Patched {name}: {manifest.relative_to(dest)}; Next.js={next((v for k in ('dependencies','devDependencies','optionalDependencies') for n,v in pkg.get(k,{}).items() if n == 'next'), 'not found')}; shadcn moved to devDependencies={ 'shadcn' in pkg.get('devDependencies', {}) }")
          PY

      - name: Install, build, and audit patched packages
        shell: bash
        run: |
          set -euo pipefail
          for name in aether kiln-estates nexi-ai; do
            project=$(find ".remediation/$name" -name package.json -not -path '*/node_modules/*' -print -quit | xargs -r dirname)
            test -n "$project"
            echo "===== $name: install ====="
            (cd "$project" && npm install --legacy-peer-deps --no-fund)
            echo "===== $name: production dependency audit ====="
            (cd "$project" && npm audit --audit-level=high --omit=dev)
            echo "===== $name: build ====="
            (cd "$project" && npm run build)
          done

      - name: Repack audited archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for name in ("aether", "kiln-estates", "nexi-ai"):
              root = Path(".remediation") / name
              archive = Path("public/downloads") / f"{name}.zip"
              temp = archive.with_suffix(".zip.tmp")
              with zipfile.ZipFile(temp, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
                  for file in sorted(root.rglob("*")):
                      if not file.is_file() or "node_modules" in file.parts or ".next" in file.parts or ".git" in file.parts:
                          continue
                      zf.write(file, file.relative_to(root).as_posix())
              temp.replace(archive)
              print(f"Repacked {archive} ({archive.stat().st_size} bytes)")
          PY

      - name: Commit only after all audits and builds pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/aether.zip public/downloads/kiln-estates.zip public/downloads/nexi-ai.zip
          if git diff --cached --quiet; then
            echo "No archive changes."
            exit 0
          fi
          git commit -m "fix(security): patch shipped template runtime dependencies"
          git push origin HEAD:test/payment-outbox-regression
