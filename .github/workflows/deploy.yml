name: Deploy to Cloudflare Workers

# Keep production deployment in sync with generated demo captures committed by CI.


on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: nexora-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Worker code depends on the production D1 schema. A migration
      # failure must block deployment; otherwise a new Worker can go live
      # against an older schema and fail at runtime.
      - name: Check pending D1 migrations
        run: npx wrangler d1 migrations list nexora-orders --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nexora-orders --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build AETHER static live demo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aether-build public/demo/aether .aether-wrangler.jsonc
          mkdir -p .aether-build public/demo/aether
          unzip -q public/downloads/aether.zip -d .aether-build
          cat > .aether-build/next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            typescript: { ignoreBuildErrors: true },
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF
          cd .aether-build
          npm install --no-fund --no-audit
          npm run build
          cd ..
          cp -R .aether-build/out/. public/demo/aether/
          test -f public/demo/aether/index.html

      - name: Deploy AETHER as dedicated static Worker
        run: |
          cat > .aether-wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nexora-aether-demo",
            "compatibility_date": "2026-07-01",
            "assets": {
              "directory": ".aether-build/out",
              "html_handling": "auto-trailing-slash"
            }
          }
          EOF
          npx wrangler deploy --config .aether-wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy NEXORA
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check production Gmail configuration
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list --name nexora-core 2>/dev/null || true)"
          echo "$secrets"
          for key in GMAIL_USER GMAIL_APP_PASSWORD NOTIFY_EMAIL; do
            if printf '%s\n' "$secrets" | grep -q "$key"; then
              echo "GMAIL_CONFIG $key=present"
            else
              echo "GMAIL_CONFIG $key=missing"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production smoke audit
        shell: bash
        run: |
          set -euo pipefail
          base="https://nexora-core.nxora.workers.dev"
          for path in /en /en/templates /en/templates/vesper /robots.txt /sitemap.xml /api/products.xml; do
            code="$(curl -L -sS -o /tmp/nexora-response -w "%{http_code}" "$base$path")"
            test "$code" = "200"
            echo "$code $path"
          done

          curl -L -sS "$base/en/templates/vesper" > /tmp/nexora-product.html
          grep -q '"@type":"Product"' /tmp/nexora-product.html
          grep -q 'nexora-vesper' /tmp/nexora-product.html

          curl -L -sS "$base/sitemap.xml" > /tmp/nexora-sitemap.xml
          grep -q '/en/templates/vesper' /tmp/nexora-sitemap.xml
          grep -q '/en/docs/vesper' /tmp/nexora-sitemap.xml

          curl -L -sS "$base/robots.txt" | grep -q 'sitemap.xml'

          curl -L -sS "$base/api/products.xml" > /tmp/nexora-products.xml
          grep -q 'nexora-vesper' /tmp/nexora-products.xml
          image_code="$(curl -L -sS -o /tmp/vesper-gallery.png -w "%{http_code}" "$base/templates/gallery/vesper/real-desktop.png")"
          test "$image_code" = "200"
          test "$(wc -c < /tmp/vesper-gallery.png)" -gt 20000
          video_code="$(curl -L -sS -o /tmp/vesper-walkthrough.webm -w "%{http_code}" "$base/templates/video/vesper/walkthrough.webm")"
          test "$video_code" = "200"
          test "$(wc -c < /tmp/vesper-walkthrough.webm)" -gt 100000
          echo "200 Vesper gallery image and walkthrough video"
