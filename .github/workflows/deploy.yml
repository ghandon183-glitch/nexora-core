name: Deploy to Cloudflare Workers

# Keep production deployment in sync with generated demo captures committed by CI.


on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: nexora-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Worker code depends on the production D1 schema. A migration
      # failure must block deployment; otherwise a new Worker can go live
      # against an older schema and fail at runtime.
      - name: Check pending D1 migrations
        run: npx wrangler d1 migrations list nexora-orders --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nexora-orders --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build AETHER static live demo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aether-build .aether-wrangler.jsonc
          mkdir -p .aether-build
          unzip -q public/downloads/aether.zip -d .aether-build
          cat > .aether-build/next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            typescript: { ignoreBuildErrors: true },
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF
          cd .aether-build
          npm install --no-fund --no-audit
          npm run build
          cd ..

          # Bing's crawler checks the exported AETHER HTML. Keep the generated
          # static demo accessible while ensuring every content image has an
          # explicit, meaningful alt attribute when the upstream template omits it.
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".aether-build/out")
          image_re = re.compile(r"<img\b(?P<attrs>[^>]*?)(?P<close>/?)>", re.IGNORECASE)
          runtime_img_re = re.compile(r'(\b(?:jsx|jsxs|jsxDEV)\(\s*["\']img["\']\s*,\s*\{)(?![^}]*\balt\s*:)', re.IGNORECASE)
          changed = [0]
          html_imgs = [0]
          runtime_imgs = [0]

          def alt_for(attrs):
              src_match = re.search(r'\bsrc\s*=\s*["\']([^"\']+)["\']', attrs, re.IGNORECASE)
              src = src_match.group(1).lower() if src_match else ""
              if "hero-fallback" in src:
                  return "AETHER creative studio hero"
              if "texture-abstract" in src:
                  return "Abstract texture for the AETHER creative studio"
              return "Aether demo image"

          for html_path in root.rglob("*.html"):
              html = html_path.read_text(encoding="utf-8")
              html_imgs[0] += len(image_re.findall(html))

              def patch(match):
                  attrs = match.group("attrs")
                  alt_match = re.search(r'\balt\s*=\s*(["\'])(.*?)\1', attrs, re.IGNORECASE | re.DOTALL)
                  if alt_match and alt_match.group(2).strip():
                      return match.group(0)

                  alt_text = alt_for(attrs)
                  if alt_match:
                      new_attrs = (
                          attrs[:alt_match.start(2)]
                          + alt_text
                          + attrs[alt_match.end(2):]
                      )
                      changed[0] += 1
                      return f'<img{new_attrs}{match.group("close")}>'

                  changed[0] += 1
                  return f'<img{attrs} alt="{alt_text}"{match.group("close")}>'

              patched = image_re.sub(patch, html)
              if patched != html:
                  html_path.write_text(patched, encoding="utf-8")

          # Next's static export can render images through the React JSX runtime,
          # so also patch compiled JS when an <img> is created client-side.
          for js_path in root.rglob("*.js"):
              js = js_path.read_text(encoding="utf-8", errors="ignore")
              runtime_imgs[0] += len(runtime_img_re.findall(js))
              patched = runtime_img_re.sub(
                  lambda match: match.group(1) + 'alt:"Aether demo image",',
                  js,
              )
              if patched != js:
                  changed[0] += 1
                  js_path.write_text(patched, encoding="utf-8")

          print(f"AETHER_HTML_IMG_TAGS={html_imgs[0]}")
          print(f"AETHER_RUNTIME_IMG_CALLS={runtime_imgs[0]}")
          print(f"AETHER_ALT_PATCHES={changed[0]}")
          if html_imgs[0] + runtime_imgs[0] == 0:
              print("AETHER_ALT_PATCHES=0: no static or React-runtime img elements detected; no alt patch required")
          PY
          cat > .aether-build/out/_redirects <<'EOF'
          /demo/aether/index.html /demo/aether/ 301
          /index.html / 301
          EOF
          test -f .aether-build/out/index.html

      - name: Deploy AETHER as dedicated static Worker
        run: |
          cat > .aether-wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nexora-aether-demo",
            "compatibility_date": "2026-07-01",
            "assets": {
              "directory": ".aether-build/out",
              "html_handling": "auto-trailing-slash"
            }
          }
          EOF
          npx wrangler deploy --config .aether-wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy NEXORA
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check production Gmail configuration
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list --name nexora-core 2>/dev/null || true)"
          echo "$secrets"
          for key in GMAIL_USER GMAIL_APP_PASSWORD NOTIFY_EMAIL; do
            if printf '%s\n' "$secrets" | grep -q "$key"; then
              echo "GMAIL_CONFIG $key=present"
            else
              echo "GMAIL_CONFIG $key=missing"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production smoke audit
        shell: bash
        run: |
          set -euo pipefail
          base="https://nexora-core.nxora.workers.dev"
          key_response="$(curl -L -sS "$base/7fec80c6cbd74405bad9e8ca5bcec3dc.txt")"
          test "$key_response" = "7fec80c6cbd74405bad9e8ca5bcec3dc"
          echo "200 /7fec80c6cbd74405bad9e8ca5bcec3dc.txt (IndexNow key verified)"

          for path in /en /en/templates /en/templates/vesper /robots.txt /sitemap.xml /api/products.xml; do
            code="$(curl -L -sS -o /tmp/nexora-response -w "%{http_code}" "$base$path")"
            test "$code" = "200"
            echo "$code $path"
          done

          curl -L -sS "$base/en/templates/vesper" > /tmp/nexora-product.html
          grep -q '"@type":"Product"' /tmp/nexora-product.html
          grep -q 'nexora-vesper' /tmp/nexora-product.html

          curl -L -sS "$base/sitemap.xml" > /tmp/nexora-sitemap.xml
          grep -q '/en/templates/vesper' /tmp/nexora-sitemap.xml
          grep -q '/en/docs/vesper' /tmp/nexora-sitemap.xml

          curl -L -sS "$base/robots.txt" | grep -q 'sitemap.xml'

          curl -L -sS "$base/api/products.xml" > /tmp/nexora-products.xml
          grep -q 'nexora-vesper' /tmp/nexora-products.xml

          for legacy_path in /demo/aether/index.html /demo/aether/; do
            code="$(curl -sS -o /dev/null -w "%{http_code}" -D /tmp/aether-headers "$base$legacy_path")"
            test "$code" = "301" || test "$code" = "307"
            grep -Eqi '^location: https://nexora-aether-demo\.nxora\.workers\.dev/[[:space:]]*$' /tmp/aether-headers
            echo "$code $legacy_path -> dedicated AETHER Worker"
          done
          aether_canonical_code="$(curl -L -sS -o /tmp/aether-response -w "%{http_code}" "https://nexora-aether-demo.nxora.workers.dev/")"
          test "$aether_canonical_code" = "200"
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen
          import re
          base = "https://nexora-aether-demo.nxora.workers.dev/"
          html = Path("/tmp/aether-response").read_text(encoding="utf-8")
          missing = []
          for match in re.finditer(r"<img\b[^>]*>", html, re.IGNORECASE):
              if not re.search(r"\balt\s*=", match.group(0), re.IGNORECASE):
                  missing.append(match.group(0)[:200])
          print(f"AETHER_SMOKE_MISSING_ALT={len(missing)}")
          if missing:
              raise SystemExit("AETHER production HTML still contains image(s) without alt")
          refs = set(re.findall(r"""(?:src|href)=["']([^"']+)["']""", html, re.IGNORECASE))
          assets = sorted(ref for ref in refs if re.search(r"\.(?:js|css|png|jpe?g|webp|svg|ico|woff2?|webm|mp4)(?:[?#]|$)", ref, re.IGNORECASE))
          checked = 0
          for ref in assets:
              url = urljoin(base, ref)
              if urlparse(url).netloc != urlparse(base).netloc:
                  continue
              try:
                  with urlopen(url, timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError(f"{response.status} {url}")
                  checked += 1
              except Exception as exc:
                  raise SystemExit(f"AETHER asset failed: {url}: {exc}")
          print(f"AETHER_SMOKE_ASSETS_OK={checked}")
          if checked < 5:
              raise SystemExit(f"Too few AETHER assets checked: {checked}")
          PY
          echo "AETHER dedicated Worker HTTP 200; image alt and asset checks passed"

          curl -L -sS "$base/en" > /tmp/nexora-home.html
          grep -q 'template preview' /tmp/nexora-home.html
          echo "Homepage template preview images have meaningful alt text"

          curl -L -sS "$base/demo/vesper/" > /tmp/nexora-vesper-demo.html
          grep -q '<h1' /tmp/nexora-vesper-demo.html
          grep -q 'Generative Directing System for Cinematic Reality' /tmp/nexora-vesper-demo.html
          echo "Vesper demo contains a crawlable H1"

          image_code="$(curl -L -sS -o /tmp/vesper-gallery.png -w "%{http_code}" "$base/templates/gallery/vesper/real-desktop.png")"
          test "$image_code" = "200"
          test "$(wc -c < /tmp/vesper-gallery.png)" -gt 20000
          video_code="$(curl -L -sS -o /tmp/vesper-walkthrough.webm -w "%{http_code}" "$base/templates/video/vesper/walkthrough.webm")"
          test "$video_code" = "200"
          test "$(wc -c < /tmp/vesper-walkthrough.webm)" -gt 100000
          echo "200 Vesper gallery image and walkthrough video"
