name: Deploy to Cloudflare Workers

# Keep production deployment in sync with generated demo captures committed by CI.


on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: nexora-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Worker code depends on the production D1 schema. A migration
      # failure must block deployment; otherwise a new Worker can go live
      # against an older schema and fail at runtime.
      - name: Check pending D1 migrations
        run: npx wrangler d1 migrations list nexora-orders --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nexora-orders --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build AETHER static live demo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aether-build public/demo/aether .aether-wrangler.jsonc
          mkdir -p .aether-build public/demo/aether
          unzip -q public/downloads/aether.zip -d .aether-build
          cat > .aether-build/next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            typescript: { ignoreBuildErrors: true },
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF
          cd .aether-build
          npm install --no-fund --no-audit
          npm run build
          cd ..
          cp -R .aether-build/out/. public/demo/aether/

          # Bing's crawler checks the exported AETHER HTML. Keep the generated
          # static demo accessible while ensuring every content image has an
          # explicit, meaningful alt attribute when the upstream template omits it.
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".aether-build/out")
          image_re = re.compile(r"<img\\b(?P<attrs>[^>]*?)(?P<close>/?)>", re.IGNORECASE)
          changed = [0]
          for html_path in root.rglob("*.html"):
              html = html_path.read_text(encoding="utf-8")

              def patch(match):
                  attrs = match.group("attrs")
                  if re.search(r"\\balt\\s*=", attrs, re.IGNORECASE):
                      return match.group(0)
                  changed[0] += 1
                  return f'<img{attrs} alt="Aether demo image"{match.group("close")}>'

              patched = image_re.sub(patch, html)
              if patched != html:
                  html_path.write_text(patched, encoding="utf-8")

          print(f"AETHER_ALT_PATCHES={changed[0]}")
          if changed[0] < 1:
              raise SystemExit("AETHER_ALT_PATCHES=0: expected at least one missing alt in exported AETHER HTML")
          PY
          cp -R .aether-build/out/. public/demo/aether/
          cat > .aether-build/out/_redirects <<'EOF'
          /demo/aether/index.html /demo/aether/ 301
          /index.html / 301
          EOF
          test -f public/demo/aether/index.html

      - name: Deploy AETHER as dedicated static Worker
        run: |
          cat > .aether-wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nexora-aether-demo",
            "compatibility_date": "2026-07-01",
            "assets": {
              "directory": ".aether-build/out",
              "html_handling": "auto-trailing-slash"
            }
          }
          EOF
          npx wrangler deploy --config .aether-wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy NEXORA
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check production Gmail configuration
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list --name nexora-core 2>/dev/null || true)"
          echo "$secrets"
          for key in GMAIL_USER GMAIL_APP_PASSWORD NOTIFY_EMAIL; do
            if printf '%s\n' "$secrets" | grep -q "$key"; then
              echo "GMAIL_CONFIG $key=present"
            else
              echo "GMAIL_CONFIG $key=missing"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production smoke audit
        shell: bash
        run: |
          set -euo pipefail
          base="https://nexora-core.nxora.workers.dev"
          key_response="$(curl -L -sS "$base/7fec80c6cbd74405bad9e8ca5bcec3dc.txt")"
          test "$key_response" = "7fec80c6cbd74405bad9e8ca5bcec3dc"
          echo "200 /7fec80c6cbd74405bad9e8ca5bcec3dc.txt (IndexNow key verified)"

          for path in /en /en/templates /en/templates/vesper /robots.txt /sitemap.xml /api/products.xml; do
            code="$(curl -L -sS -o /tmp/nexora-response -w "%{http_code}" "$base$path")"
            test "$code" = "200"
            echo "$code $path"
          done

          curl -L -sS "$base/en/templates/vesper" > /tmp/nexora-product.html
          grep -q '"@type":"Product"' /tmp/nexora-product.html
          grep -q 'nexora-vesper' /tmp/nexora-product.html

          curl -L -sS "$base/sitemap.xml" > /tmp/nexora-sitemap.xml
          grep -q '/en/templates/vesper' /tmp/nexora-sitemap.xml
          grep -q '/en/docs/vesper' /tmp/nexora-sitemap.xml

          curl -L -sS "$base/robots.txt" | grep -q 'sitemap.xml'

          curl -L -sS "$base/api/products.xml" > /tmp/nexora-products.xml
          grep -q 'nexora-vesper' /tmp/nexora-products.xml

          aether_legacy_code="$(curl -sS -o /dev/null -w "%{http_code}" -D /tmp/aether-headers "$base/demo/aether/index.html")"
          test "$aether_legacy_code" = "301" || test "$aether_legacy_code" = "307"
          grep -Eqi '^location:.*/demo/aether/[[:space:]]*$' /tmp/aether-headers
          aether_canonical_code="$(curl -L -sS -o /tmp/aether-response -w "%{http_code}" "$base/demo/aether/")"
          test "$aether_canonical_code" = "200"
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("/tmp/aether-response").read_text(encoding="utf-8")
          missing = []
          for match in re.finditer(r"<img\\b[^>]*>", html, re.IGNORECASE):
              if not re.search(r"\\balt\\s*=", match.group(0), re.IGNORECASE):
                  missing.append(match.group(0)[:200])
          print(f"AETHER_SMOKE_MISSING_ALT={len(missing)}")
          if missing:
              raise SystemExit("AETHER production HTML still contains image(s) without alt")
          PY
          echo "$aether_legacy_code /demo/aether/index.html -> /demo/aether/ and canonical 200; image alt check passed"

          curl -L -sS "$base/en" > /tmp/nexora-home.html
          grep -q 'template preview' /tmp/nexora-home.html
          echo "Homepage template preview images have meaningful alt text"

          curl -L -sS "$base/demo/vesper/" > /tmp/nexora-vesper-demo.html
          grep -q '<h1' /tmp/nexora-vesper-demo.html
          grep -q 'Generative Directing System for Cinematic Reality' /tmp/nexora-vesper-demo.html
          echo "Vesper demo contains a crawlable H1"

          image_code="$(curl -L -sS -o /tmp/vesper-gallery.png -w "%{http_code}" "$base/templates/gallery/vesper/real-desktop.png")"
          test "$image_code" = "200"
          test "$(wc -c < /tmp/vesper-gallery.png)" -gt 20000
          video_code="$(curl -L -sS -o /tmp/vesper-walkthrough.webm -w "%{http_code}" "$base/templates/video/vesper/walkthrough.webm")"
          test "$video_code" = "200"
          test "$(wc -c < /tmp/vesper-walkthrough.webm)" -gt 100000
          echo "200 Vesper gallery image and walkthrough video"
