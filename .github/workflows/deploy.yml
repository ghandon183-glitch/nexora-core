name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AETHER static live demo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aether-build public/demo/aether .aether-wrangler.jsonc
          mkdir -p .aether-build public/demo/aether
          unzip -q public/downloads/aether.zip -d .aether-build
          cat > .aether-build/next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            typescript: { ignoreBuildErrors: true },
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF
          cd .aether-build
          npm install --no-fund --no-audit
          npm run build
          cd ..
          cp -R .aether-build/out/. public/demo/aether/
          test -f public/demo/aether/index.html

      - name: Deploy AETHER as dedicated static Worker
        run: |
          cat > .aether-wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nexora-aether-demo",
            "compatibility_date": "2026-07-01",
            "assets": {
              "directory": ".aether-build/out",
              "html_handling": "auto-trailing-slash"
            }
          }
          EOF
          npx wrangler deploy --config .aether-wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy NEXORA
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
