name: Temporary production route diagnosis

on:
  push:
    branches:
      - codex/security-dependency-remediation-2026-10-23

permissions:
  contents: read

jobs:
  read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose public production routes (GET only)
        shell: bash
        run: |
          set -u
          base="https://nexora-core.nxora.workers.dev"
          for path in /en /en/templates /en/templates/vesper /en/templates/aether /robots.txt /sitemap.xml /api/products.xml /demo/vesper/; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --max-time 20 -L -sS -D "$headers" -o "$body" -w "%{http_code}" "$base$path" || true)"
            content_type="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            sample="$(head -c 180 "$body" | tr '\n' ' ' | tr '\r' ' ' | sed 's/[^[:print:]]/?/g')"
            echo "DIAG path=$path status=$code bytes=$bytes $content_type"
            echo "DIAG_BODY path=$path sample=$sample"
            rm -f "$headers" "$body"
          done
