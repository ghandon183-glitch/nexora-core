name: Check pending payments

# Manual diagnostic fallback for payment reconciliation.
# Automated five-minute reconciliation runs from the dedicated Cloudflare Cron Worker.
# Required GitHub repository secrets for manual runs:
#   CRON_SECRET — must match the Cloudflare Worker secret.
#   SITE_URL    — deployed site origin, without a trailing slash.
on:
  workflow_dispatch: {}

jobs:
  check-payments:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger payment check and fail on reported processing errors
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            --request POST \
            --url "${SITE_URL}/api/cron/check-payments" \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --max-time 55)"

          # HTTP 200 alone is insufficient: the route can return ok=true while
          # individual order/provider/email operations have been recorded as errors.
          CRON_RESPONSE="$response" node <<'NODE'
          const data = JSON.parse(process.env.CRON_RESPONSE ?? "");
          const failures = [];

          if (data.ok !== true) failures.push("endpoint did not report ok=true");
          if (Array.isArray(data.errors) && data.errors.length > 0) {
            failures.push(`${data.errors.length} order-processing error(s)`);
          }
          if (Array.isArray(data.paymegateErrors) && data.paymegateErrors.length > 0) {
            failures.push(`${data.paymegateErrors.length} PayMeGate reconciliation error(s)`);
          }
          if (Number(data.emailOutbox?.failed ?? 0) > 0) {
            failures.push(`${data.emailOutbox.failed} email outbox delivery failure(s)`);
          }

          console.log(JSON.stringify({
            ok: data.ok === true,
            checked: data.checked ?? null,
            confirmed: data.confirmed ?? null,
            expired: data.expired ?? null,
            review: data.review ?? null,
            emailsRetried: data.emailsRetried ?? null,
            failures,
          }));

          if (failures.length > 0) process.exit(1);
          NODE
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
