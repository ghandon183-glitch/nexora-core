name: Repair shipped template dependency archives

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-shipped-template-archives.yml"

permissions:
  contents: write

concurrency:
  group: repair-shipped-template-archives
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The source fixes ship in scripts/harden-template-archives.py and nowhere
      # else. This workflow used to carry its own copy of the AETHER rewrites,
      # which drifted: once the canonical hardener replaced `pointer.useRef`
      # with a `pointerRef` prop, the older copy still matched two anchors and
      # injected `sharedPointer.copy(...)` without ever inserting the
      # `const sharedPointer` declaration it depended on, so `npx tsc --noEmit`
      # failed with TS2304 on components/webgl/hero-scene.tsx. Delegating here
      # keeps one patcher and makes the operator re-run idempotent.
      - name: Re-harden the shipped archives with the canonical patcher
        shell: bash
        run: |
          set -euo pipefail
          for archive in aether.zip kiln-estates.zip nexi-ai.zip; do
            NEXORA_PACKAGE_TARGET="$archive" python3 scripts/harden-template-archives.py
          done
      - name: Verify the rebuilt archives on a clean extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-template-packages.py \
            --only aether,kiln-estates,nexi-ai \
            --out .deep-audit/repair-report.json
      - name: Commit repaired archives only after every build and audit passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/aether.zip public/downloads/kiln-estates.zip public/downloads/nexi-ai.zip
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "fix(security): rebuild shipped templates with patched Next.js"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
